name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CI_DATABASE_URL: mysql://root:root@127.0.0.1:3306/funeralstationary

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: funeralstationary
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Production applies the committed drizzle/ migrations on deploy
      # (scripts/migrate-on-deploy.ts) — there's no live-DB diffing. That only
      # works if every schema change arrives with its migration already
      # generated: this re-runs `generate` (a pure file diff; DATABASE_URL is
      # only there because drizzle.config.ts requires one) and fails if it
      # would produce anything not already committed.
      - name: Check schema migrations are up to date
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::src/db/schema changed without a matching migration. Run 'npm run db:generate' locally and commit the result."
            git status --porcelain drizzle/
            exit 1
          fi

      - run: npm test

      # Deliberately run WITHOUT DATABASE_URL. A build imports every Route
      # Handler to read its config exports, so this also guards against the
      # database client being constructed at module scope again — a build
      # must never require a reachable database.
      - run: npm run build

      - name: Apply migrations to a fresh database
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Seed the catalogue
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      # Re-running must be a no-op: the seed upserts by slug and rebuilds the
      # category links, so a second pass proves it reconciles rather than
      # accumulating duplicate rows.
      - name: Seed is idempotent
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Verify seeded catalogue
        run: npx tsx scripts/verify-seed.ts
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
